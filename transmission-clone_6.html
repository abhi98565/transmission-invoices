<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transmission</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','Segoe UI',Roboto,Arial,sans-serif;font-size:14px;color:#1a1a1a;background:#fff}
a{text-decoration:none;color:inherit;cursor:pointer}
button{cursor:pointer;font-family:inherit;border:none;background:none}
input,select{font-family:inherit;outline:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;flex-direction:column;height:100vh}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15);pointer-events:none}

/* ===== NAV ===== */
.topnav{height:48px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;z-index:50}
.topnav-left{display:flex;align-items:center;gap:0;height:100%}
.topnav-right{display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;margin-right:24px;cursor:pointer}
.brand svg{width:26px;height:26px}
.nav-links{display:flex;align-items:center;height:100%}
.nl{padding:0 12px;height:100%;display:flex;align-items:center;font-size:14px;font-weight:500;color:#6b7280;cursor:pointer;gap:4px}
.nl:hover{color:#374151}
.nl.active{color:#10b981;font-weight:600}
.nl .c{font-size:8px;margin-left:1px}
.nav-search{position:relative;width:220px}
.nav-search input{width:100%;border:1px solid #d1d5db;border-radius:6px;padding:7px 12px 7px 32px;font-size:13px;color:#374151}
.nav-search input::placeholder{color:#9ca3af}
.nav-search input:focus{border-color:#10b981}
.nav-search .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#9ca3af}
.bell{position:relative;cursor:pointer;display:flex;align-items:center}
.bell svg{width:20px;height:20px;color:#6b7280}
.bell-b{position:absolute;top:-4px;right:-8px;background:#10b981;color:#fff;font-size:9.5px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:18px;text-align:center;line-height:1.5}
.user-toggle{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:14px;color:#374151;font-weight:500}

/* ===== TZ BANNER ===== */
.tz{background:#fffbeb;border-bottom:1px solid #fde68a;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#92400e;flex-shrink:0}
.tz.hid{display:none}
.tz-inner{display:flex;align-items:center;gap:10px}
.tz-x{font-size:18px;color:#92400e;cursor:pointer;padding:2px 6px}

/* ===== TOOLBAR ===== */
.inv-toolbar{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-bottom:1px solid #e5e7eb;flex-shrink:0;background:#fff}
.btn-bd{border:1px solid #d1d5db;border-radius:6px;padding:7px 16px;font-size:13px;color:#374151;background:#fff;font-weight:500}
.btn-bd:hover{background:#f9fafb}
.btn-ci{border:none;border-radius:6px;padding:8px 18px;font-size:13px;color:#fff;background:#10b981;font-weight:600}
.btn-ci:hover{background:#059669}

/* ===== MAIN SHELL ===== */
.inv-shell{display:flex;flex:1;overflow:hidden}

/* Icon tabs */
.icon-tabs{width:38px;background:#f9fafb;border-right:1px solid #e5e7eb;display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;flex-shrink:0}
.it{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#9ca3af;cursor:pointer;transition:all .15s}
.it:hover{background:#e5e7eb;color:#374151}
.it.active{color:#10b981;background:#ecfdf5}
.it.dark{background:#374151;color:#fff;border-radius:50%;font-size:11px;font-weight:700;width:26px;height:26px;margin-top:4px}

/* Status sidebar (≡ tab) */
.status-side{width:220px;border-right:1px solid #e5e7eb;flex-shrink:0;padding:16px 0;display:none}
.status-side.show{display:block}
.status-side h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;padding:0 16px;margin-bottom:12px}
.si-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-size:14px;cursor:pointer;color:#374151;border-left:3px solid transparent;transition:background .1s}
.si-row:hover{background:#f3f4f6}
.si-row.active{background:#eff6ff;border-left-color:#10b981;font-weight:700;color:#10b981}
.si-row .si-icon{margin-right:8px;font-size:13px;display:inline-flex;align-items:center}
.si-row .cnt{font-weight:600;font-size:13px;color:#9ca3af}
.si-row.active .cnt{color:#10b981;background:#d1fae5;border-radius:10px;padding:1px 8px;font-size:12px}

/* Invoice list */
.inv-list{width:280px;border-right:1px solid #e5e7eb;overflow-y:auto;flex-shrink:0;display:none}
.inv-list.show{display:block}
.inv-list-hdr{padding:10px 14px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#9ca3af;border-bottom:1px solid #f3f4f6;position:sticky;top:0;background:#fff;z-index:2}
.inv-item{padding:10px 14px;border-bottom:1px solid #f3f4f6;cursor:pointer;transition:background .15s}
.inv-item:hover{background:#f9fafb}
.inv-item.selected{background:#ecfdf5;border-left:3px solid #10b981}
.inv-item-name{font-size:13px;font-weight:600;color:#374151}
.inv-item-flex{font-size:12px;color:#9ca3af;margin-top:1px}

/* Detail panel */
.inv-detail{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.inv-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.inv-empty h2{font-size:18px;font-weight:700;color:#1f2937;margin-top:16px}
.inv-empty p{font-size:13px;color:#9ca3af;margin-top:4px}
.mag{width:140px;height:140px}

/* Detail content */
.detail-scroll{flex:1;overflow-y:auto;padding:0}

/* Banners */
.banner{padding:12px 16px;display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid #e5e7eb;font-size:13px;color:#374151;line-height:1.5}
.banner-info{background:#eff6ff}
.banner-info .b-icon{color:#3b82f6;font-size:16px;flex-shrink:0;margin-top:1px}
.banner-flag{background:#fff}
.banner-flag .b-icon{flex-shrink:0;margin-top:2px}
.banner-err{background:#fef2f2;border:1.5px solid #fca5a5;border-radius:6px;margin:12px 16px;color:#991b1b;font-weight:500}
.banner-err .b-icon{color:#ef4444;font-size:16px;flex-shrink:0}
.banner-x{margin-left:auto;color:#9ca3af;cursor:pointer;font-size:16px;flex-shrink:0;padding:0 4px}
.banner-x:hover{color:#374151}
.banner a{color:#10b981;font-weight:500;text-decoration:underline}

/* Invoice header */
.inv-header{padding:16px 20px;border-bottom:1px solid #e5e7eb}
.inv-name{font-size:22px;font-weight:700;color:#10b981;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.inv-name .edit-icon{color:#10b981;font-size:14px;cursor:pointer}
.inv-name.unnamed{color:#10b981}
.inv-flexid{font-size:13px;color:#6b7280;margin-bottom:4px}
.inv-status{font-size:13px;color:#374151;margin-bottom:2px}
.inv-issued{font-size:13px;color:#6b7280;margin-bottom:2px}
.inv-due{font-size:13px;color:#6b7280;display:flex;align-items:center;gap:6px}
.inv-due-tag{background:#f3f4f6;border-radius:12px;padding:2px 10px;font-size:11px;color:#6b7280;display:inline-flex;align-items:center;gap:4px}
.inv-actions{position:absolute;top:16px;right:20px;display:flex;gap:8px}
.btn-del{border:1px solid #fca5a5;border-radius:6px;padding:7px 14px;font-size:13px;color:#ef4444;background:#fff;font-weight:500;display:flex;align-items:center;gap:5px}
.btn-del:hover{background:#fef2f2}
.btn-send{border:none;border-radius:6px;padding:8px 20px;font-size:13px;color:#fff;background:#10b981;font-weight:600}
.btn-send:hover{background:#059669}

/* Bill from/to */
.bill-section{padding:14px 20px;border-bottom:1px solid #e5e7eb}
.bill-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.bill-dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0}
.bill-dot.from{background:#1f2937}
.bill-dot.to{border:2px solid #6b7280;background:#fff}
.bill-label{font-size:13px;color:#6b7280}
.bill-name{font-weight:700;color:#1f2937}
.bill-addr{font-size:12.5px;color:#6b7280;margin-top:2px}

/* Info msg */
.info-msg{padding:12px 20px;border-bottom:1px solid #e5e7eb;font-size:13px;color:#6b7280;display:flex;align-items:center;gap:8px}
.info-msg .ii{color:#3b82f6;font-size:15px}

/* Content area — split layout */
.content-split{display:flex;flex:1}
.content-left{flex:1;overflow-y:auto;border-right:1px solid #e5e7eb;padding:0}
.content-right{width:420px;overflow-y:auto;flex-shrink:0;padding:0}

/* Route */
.section{padding:18px 20px}
.section-title{font-size:16px;font-weight:700;color:#1f2937;margin-bottom:14px}
.route-line{display:flex;align-items:center;gap:0;margin-bottom:16px;padding:0 4px}
.route-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.route-dot.pickup{background:#1f2937}
.route-dot.delivery{border:2px solid #6b7280;background:#fff}
.route-bar{flex:1;height:2px;background:#d1d5db}
.route-label{font-size:11px;color:#6b7280;margin-left:4px}
.route-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.route-col h4{font-size:14px;font-weight:700;color:#1f2937;margin-bottom:6px}
.route-col .addr{font-size:12.5px;color:#6b7280;line-height:1.5}
.route-col .firms{font-size:12px;color:#9ca3af;margin-top:2px}
.verified-row{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:#374151}
.verified-row .v-check{color:#10b981;font-size:14px}
.port-info{font-size:12.5px;color:#6b7280;margin-top:2px}
.contacts-link{font-size:12.5px;color:#10b981;margin-top:4px;cursor:pointer}
.feature-list{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.feature-item{font-size:12.5px;color:#374151;display:flex;align-items:center;gap:6px}
.feature-item .fcheck{color:#6b7280}

/* Shipment */
.ship-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ship-label{font-size:12px;color:#6b7280;margin-bottom:2px}
.ship-val{font-size:14px;color:#1f2937;font-weight:500}

/* Related Deliveries */
.rd-table{width:100%;border-collapse:collapse;margin-top:8px}
.rd-table th{text-align:left;font-size:12px;font-weight:600;color:#6b7280;padding:8px 0;border-bottom:1px solid #e5e7eb}
.rd-table td{font-size:13px;color:#374151;padding:10px 0;border-bottom:1px solid #f3f4f6}
.rd-table td a{color:#2563eb;font-weight:500}

/* Documents */
.doc-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.doc-link{color:#10b981;font-weight:500;font-size:13px}
.doc-dl{color:#6b7280;cursor:pointer;font-size:16px}
.doc-dl:hover{color:#374151}

/* Right panel — Invoice Details */
.rp-header{padding:14px 16px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between}
.rp-title{font-size:16px;font-weight:700;color:#1f2937}
.rp-add{color:#10b981;font-weight:500;font-size:13px;cursor:pointer}
.rp-add:hover{text-decoration:underline}
.rp-empty{padding:16px 16px;font-size:13px;color:#9ca3af;line-height:1.5}

/* Column headers (Item | Quantity/Weight | Rate | Charge) */
.col-hdr{display:flex;align-items:center;padding:8px 16px;font-size:12px;font-weight:600;color:#67768d;background:#fff;border-bottom:1px solid #e5e7eb}
.col-hdr .col-item{flex:0 0 30%;padding-left:2%}
.col-hdr .col-qty{flex:1;text-align:right}
.col-hdr .col-rate{flex:0 0 5%;text-align:right}
.col-hdr .col-charge{flex:1;text-align:right;padding-right:1%}
.col-hdr .col-actions{flex:0 0 60px}

/* Container group */
.cnt-group{padding:12px 16px 4px}
.cnt-check{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.cnt-check input[type=checkbox]{width:18px;height:18px;accent-color:#10b981;cursor:pointer;flex-shrink:0}
.cnt-check label{font-size:14px;color:#39414d;font-weight:400;cursor:pointer}
.cnt-status{font-size:12px;color:#67768d;margin-left:26px;margin-bottom:8px}

/* Line item card */
.li-card{border:1px solid #c5d2e7;margin:0 0 10px;overflow:hidden}
.li-body{display:flex;align-items:flex-start;padding:12px 10px}
.li-left{flex:0 0 30%;padding:0 8px}
.li-left .li-name{font-size:14px;color:#1f2937;font-weight:400}
.li-left .li-cont{font-size:12px;color:#67768d;margin-top:2px}
.li-mid{flex:1}
.li-right{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end}
.li-right .li-rate-val{font-size:14px;color:#1f2937}
.li-right .li-rate-unit{font-size:12px;color:#67768d;text-align:right}
.li-charge{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;padding:0 8px}
.li-charge .li-amt{font-size:14px;color:#1f2937}
.li-icons{display:flex;flex-direction:column;gap:4px;margin-left:8px;flex-shrink:0}
.li-icons button{width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;border:none;background:transparent;cursor:pointer}
.li-icons .del{color:#c0392b}
.li-icons .del:hover{background:#fef2f2}
.li-icons .edt{color:#10b981}
.li-icons .edt:hover{background:#ecfdf5}
.li-footer{padding:6px 10px;background:#f7f8fa;font-size:12px;color:#67768d}

/* Total bar */
.total-bar{display:flex;align-items:center;justify-content:flex-end;margin-top:12px;padding:0}
.total-bar .total-label{background:#f7f8fa;padding:10px 16px;font-size:16px;font-weight:700;color:#1f2937;border-radius:0 0 0 4px}
.total-bar .total-amt{background:#39414d;color:#fff;padding:10px 20px;font-size:16px;font-weight:700;border-radius:0 0 4px 0;min-width:120px;text-align:right}
.total-bar .total-amt .usd{display:block;font-size:11px;font-weight:600;color:#ccc;text-align:right}

/* Section borders */
.section+.section{border-top:1px solid #e5e7eb}

/* Exceptions */
.no-data{font-size:13px;color:#6b7280}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:600;display:none;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal-box{background:#fff;border-radius:10px;width:480px;max-width:95vw;max-height:85vh;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal-hdr{padding:14px 20px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between}
.modal-hdr h3{font-size:15px;font-weight:700}
.mc{font-size:18px;color:#9ca3af;cursor:pointer;padding:4px 8px}
.mc:hover{color:#374151}
.modal-bod{padding:18px 20px;overflow-y:auto;flex:1}
.modal-ft{padding:12px 20px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:8px}
.form-field{margin-bottom:14px}
.form-field label{display:block;font-size:12px;font-weight:600;color:#6b7280;margin-bottom:4px}
.form-field input,.form-field select,.form-field textarea{width:100%;border:1px solid #d1d5db;border-radius:6px;padding:8px 10px;font-size:13px;color:#374151;background:#fff}
.form-field input:focus,.form-field select:focus{border-color:#10b981}
.form-field textarea{min-height:60px;resize:vertical}
</style>
</head>
<body>
<div id="toast" hidden></div>
<div id="app">
<!-- NAV -->
<nav class="topnav">
  <div class="topnav-left">
    <a class="brand" onclick="showToast('Navigate to Loads')">
      <svg viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="13" fill="#10b981"/><path d="M7.5 9.5C7.5 9.5 9.5 7 13 7s5.5 2.5 5.5 2.5" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><path d="M7.5 16.5C7.5 16.5 9.5 19 13 19s5.5-2.5 5.5-2.5" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><circle cx="13" cy="13" r="2.3" stroke="#fff" stroke-width="1.7"/></svg>
    </a>
    <div class="nav-links">
      <a class="nl" onclick="showToast('Navigate to Loads')">Loads <span class="c">▾</span></a>
      <a class="nl active">Invoices</a>
      <a class="nl" onclick="showToast('Navigate to Rates')">Rates</a>
      <a class="nl" onclick="showToast('Navigate to Reports')">Reports</a>
      <a class="nl" onclick="showToast('Navigate to Workflows')">Workflows</a>
    </div>
  </div>
  <div class="topnav-right">
    <div class="nav-search"><svg class="si" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input placeholder="Search..."></div>
    <div class="bell" onclick="showToast('87 notifications')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="bell-b">87</span></div>
    <div class="user-toggle" onclick="showToast('User menu')">Sherry Swartz <span class="c">▾</span></div>
  </div>
</nav>

<!-- TZ BANNER -->
<div class="tz" id="tz">
  <div class="tz-inner">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span>Dates and times are shown in the carrier's timezone, <b>America/Detroit</b>. Your timezone is <b>Asia/Katmandu</b></span>
  </div>
  <span class="tz-x" onclick="this.parentElement.classList.add('hid')">✕</span>
</div>

<!-- TOOLBAR -->
<div class="inv-toolbar">
  <button class="btn-bd" onclick="bulkDelete()">Bulk Delete</button>
  <button class="btn-ci" onclick="openCreateModal()">Create Invoice</button>
</div>

<!-- MAIN SHELL -->
<div class="inv-shell">
  <!-- Icon tabs -->
  <div class="icon-tabs" id="iconTabs">
    <button class="it" data-tab="status" title="All Invoices" onclick="switchTab('status')">≡</button>
    <button class="it active" data-tab="draft" title="Drafts" onclick="switchTab('draft')">✎</button>
    <button class="it" data-tab="sent" title="Sent" onclick="switchTab('sent')">✈</button>
    <button class="it" data-tab="paid" title="Paid" onclick="switchTab('paid')">$</button>
    <button class="it dark" title="Disputed" onclick="switchTab('disputed')">?</button>
  </div>

  <!-- Status sidebar (≡ tab) -->
  <div class="status-side" id="statusSide">
    <h4>STATUS</h4>
    <div class="si-row" data-status="draft" onclick="selectStatus('draft')"><span><span class="si-icon">✎</span> Draft</span><span class="cnt">205</span></div>
    <div class="si-row active" data-status="sent" onclick="selectStatus('sent')"><span><span class="si-icon">✈</span> Sent</span><span class="cnt">90</span></div>
    <div class="si-row" data-status="paid" onclick="selectStatus('paid')"><span><span class="si-icon">$</span> Paid</span><span class="cnt">1892</span></div>
    <div class="si-row" data-status="disputed" onclick="selectStatus('disputed')"><span><span class="si-icon">?</span> Disputed</span><span class="cnt">5</span></div>
  </div>

  <!-- Invoice list -->
  <div class="inv-list show" id="invList"></div>

  <!-- Detail panel -->
  <div class="inv-detail" id="invDetail"></div>
</div>
</div>

<!-- Create Invoice Modal -->
<div class="modal-bg" id="createModal">
  <div class="modal-box">
    <div class="modal-hdr"><h3>Create Invoice</h3><span class="mc" onclick="closeModal('createModal')">✕</span></div>
    <div class="modal-bod">
      <div class="form-field"><label>Invoice Name</label><input id="newInvName" placeholder="Enter invoice name"></div>
      <div class="form-field"><label>Flex ID</label><select id="newInvFlex"><option>Select a load...</option><option>FLEX-3627618A</option><option>FLEX-3627619A</option><option>FLEX-3627624A</option><option>FLEX-3698462B</option><option>FLEX-3698465A</option><option>FLEX-3736756B</option><option>FLEX-3775903A</option><option>FLEX-3783113C</option><option>FLEX-3796226A</option><option>FLEX-3796233A</option><option>FLEX-3828242C</option></select></div>
      <div class="form-field"><label>Notes</label><textarea placeholder="Optional notes..."></textarea></div>
    </div>
    <div class="modal-ft">
      <button class="btn-bd" onclick="closeModal('createModal')">Cancel</button>

/* ======== TAB SWITCHING ======== */
function switchTab(tab){
  currentTab = tab;

  const btn = document.querySelector(`.it[data-tab="${tab}"]`);
  if(btn) btn.classList.add("active");

  const statusSide = document.getElementById("statusSide");
  const invList = document.getElementById("invList");

  if(tab === "status"){
    statusSide.classList.add("show");
    invList.classList.remove("show");
  } else {
    statusSide.classList.remove("show");
    invList.classList.add("show");
    renderList(tab);
  }
  renderDetail();
}

function selectStatus(status){
  document.querySelectorAll(".si-row").forEach(r=>r.classList.remove("active"));
  document.querySelector(`.si-row[data-status="${status}"]`).classList.add("active");

}

/* ======== LIST ======== */
function renderList(tab){
  const list = document.getElementById("invList");
  const headerLabels = {draft:"Draft",sent:"Sent",paid:"Paid",disputed:"Disputed"};
  let items = INVOICES;
  if(tab !== "draft") items = []; // Only draft data available

  let html = `<div class="inv-list-hdr">${headerLabels[tab]||"Invoices"}</div>`;
  if(items.length === 0){
    html += `<div style="padding:40px 20px;text-align:center;color:#9ca3af;font-size:13px">No ${tab} invoices</div>`;
  } else {
    items.forEach(inv => {
      const sel = selectedInv && selectedInv.id === inv.id;
      const displayName = inv.name === "Name unavailable" ? "Name unavailable" : inv.name;
      html += `<div class="inv-item${sel?' selected':''}" onclick="selectInvoice(${inv.id})">
        <div class="inv-item-name">${displayName}</div>
        <div class="inv-item-flex">${inv.flex}</div>
      </div>`;
    });
  }
  list.innerHTML = html;
}

function getContainerGroups(inv) {
  // Support both new containers format and legacy charges format
  if (inv.containers) {
    return inv.containers.map((cnt, ci) => renderContainerGroup(inv, cnt, ci)).join('');
  }
  if (inv.charges && inv.charges.length > 0) {
    // Legacy: wrap single container
    const cnt = { id: inv.container || '—', status: inv.rateAvailable ? 'Ready to submit' : 'Pending Delivery Completion', checked: inv.rateAvailable, charges: inv.charges };
    return renderContainerGroup(inv, cnt, 0);
  }
  return '';
}

function renderContainerGroup(inv, cnt, ci) {
  let html = `<div class="cnt-group">
    <div class="cnt-check">
      <input type="checkbox" id="cnt-${inv.id}-${ci}" ${cnt.checked ? 'checked' : ''} onchange="toggleContainer(${inv.id},${ci},this.checked)">
      <label for="cnt-${inv.id}-${ci}">${cnt.id}</label>
    </div>
    <div class="cnt-status">${cnt.status}</div>`;

  cnt.charges.forEach((ch, i) => {
    html += `<div class="li-card">
      <div class="li-body">
        <div class="li-left">
          <div class="li-name">${ch.type}</div>
          <div class="li-cont">Container/Flex ID: ${cnt.id}</div>
        </div>
        <div class="li-mid"></div>
        <div class="li-right">
          <div class="li-rate-val">${ch.amt > 0 ? ch.amt.toFixed(2) : 'Rate Unavailable'}</div>
          <div class="li-rate-unit">${ch.unit}</div>
        </div>
        <div class="li-charge">
          <div class="li-amt">USD ${ch.amt.toFixed(2)}</div>
        </div>
        <div class="li-icons">
          <button class="del" onclick="removeCharge(${inv.id},${ci},${i})" title="Delete">🗑</button>
          <button class="edt" onclick="editCharge(${inv.id},${ci},${i})" title="Edit">✎</button>
        </div>
      </div>
      <div class="li-footer">Created by Flexport Automation, Apr 24 2026 8:38 pm</div>
    </div>`;
  });

  html += `</div>`;
  return html;
}

function getTotal(inv) {
  if (inv.containers) {
    return inv.containers.reduce((s, cnt) => s + cnt.charges.reduce((s2, c) => s2 + c.amt, 0), 0);
  }
  if (inv.charges) return inv.charges.reduce((s, c) => s + c.amt, 0);
  return 0;
}

/* ======== ACTIONS ======== */
function editInvName(){
  const name = prompt("Enter invoice name:", selectedInv.name === "Name unavailable" ? "" : selectedInv.name);
  if(name !== null && name.trim()){
    selectedInv.name = name.trim();
    renderList(currentTab);
    renderDetail();
    showToast("Invoice name updated");
  }
}

function toggleContainer(invId, ci, checked) {
  const inv = INVOICES.find(i=>i.id===invId);
  if(!inv) return;
  const cnts = inv.containers || [{id:inv.container,charges:inv.charges}];
  if(cnts[ci]) cnts[ci].checked = checked;
  showToast(checked ? `${cnts[ci].id} marked ready` : `${cnts[ci].id} unmarked`);
}

function deleteInvoice(){
  if(confirm(`Delete invoice for ${selectedInv.flex}?`)){
    const idx = INVOICES.findIndex(i=>i.id===selectedInv.id);
    if(idx>=0) INVOICES.splice(idx,1);
    selectedInv = null;
    renderList(currentTab);
    renderDetail();
    showToast("Invoice deleted");
  }
}

function sendInvoice(){
  const total = getTotal(selectedInv);
  if(total === 0){
    showToast("Cannot send: total is $0.00");
    return;
  }
  selectedInv.status = "sent";
  showToast(`Invoice ${selectedInv.flex} sent to Flexport LLC — USD ${total.toFixed(2)}`);
  selectedInv = null;
  renderList(currentTab);
  renderDetail();
}

function bulkDelete(){
  showToast("Select invoices to bulk delete");
}

function openCreateModal(){
  openModal("createModal");
  document.getElementById("newInvName").value = "";
}

function createInvoice(){
  const name = document.getElementById("newInvName").value.trim() || "Name unavailable";
  const flex = document.getElementById("newInvFlex").value;
  if(flex === "Select a load..."){showToast("Please select a Flex ID");return;}
  const newInv = {
    id: Date.now(), name, flex, container:"NEW"+Math.floor(Math.random()*9999999),
    status:"draft", carrier:"", shipStatus:"Draft",
    pickupName:"", pickupAddr:"", pickupFirms:"", pickupPort:"",
    deliveryName:"", deliveryAddr:"", deliveryClient:"", deliveryHours:"",
    rateAvailable:false, charges:[]
  };
  INVOICES.unshift(newInv);
  closeModal("createModal");
  renderList(currentTab);
  selectInvoice(newInv.id);
  showToast(`Invoice created for ${flex}`);
}

function addCharge(){
  if(!selectedInv) return;
  const type = document.getElementById("chargeType").value;
  const amt = parseFloat(document.getElementById("chargeAmt").value) || 0;
  // Add to first container or legacy charges
  if(selectedInv.containers && selectedInv.containers.length > 0){
    selectedInv.containers[0].charges.push({type, amt, unit:"Per Occurrence"});
  } else {
    if(!selectedInv.charges) selectedInv.charges = [];
    selectedInv.charges.push({type, amt, unit:"Per Occurrence"});
  }
  closeModal("chargeModal");
  renderDetail();
  showToast(`${type} charge added`);
}

function removeCharge(invId, ci, chargeIdx){
  const inv = INVOICES.find(i=>i.id===invId);
  if(!inv) return;
  let charges;
  if(inv.containers) charges = inv.containers[ci].charges;
  else charges = inv.charges;
  if(charges && confirm(`Remove ${charges[chargeIdx].type} charge?`)){
    charges.splice(chargeIdx, 1);
    renderDetail();
    showToast("Charge removed");
  }
}

function editCharge(invId, ci, chargeIdx){
  const inv = INVOICES.find(i=>i.id===invId);
  if(!inv) return;
  let charges;
  if(inv.containers) charges = inv.containers[ci].charges;
  else charges = inv.charges;
  if(!charges) return;
  const ch = charges[chargeIdx];
  const newAmt = prompt(`Edit ${ch.type} amount (USD):`, ch.amt.toFixed(2));
  if(newAmt !== null){
    ch.amt = parseFloat(newAmt) || 0;
    renderDetail();
    showToast("Charge updated to USD " + ch.amt.toFixed(2));
  }
}

/* ======== INIT ======== */
renderList("draft");
renderDetail();
</script>
